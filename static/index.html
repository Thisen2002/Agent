<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Jarvis</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
<script>
  // apply the saved theme before the page paints (avoids a flash)
  try { const t = localStorage.getItem("jarvisTheme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e8eff"/><stop offset="1" stop-color="#b072ff"/></linearGradient>
  </defs>
  <symbol id="i-logo" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/><circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="16" cy="16" r="3.2" fill="currentColor"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 4.5v15" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h8M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M5.5 12.5L12 19l6.5-6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5 5 0 01-7.1-7.1l8.6-8.6a3.3 3.3 0 014.7 4.7l-8.6 8.6a1.7 1.7 0 01-2.4-2.4l7.9-7.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8l-5-5z M14 3v5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 15V6.5A2.5 2.5 0 017.5 4H15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M10.6 5.1A10 10 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-2.6 3.5M6.6 6.6A17 17 0 002 12s3.6 7 10 7a9.7 9.7 0 005.4-1.6M3 3l18 18M9.9 9.9a3 3 0 004.2 4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 17l5-5-5-5M15 12H4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 10h16M9 3v4M15 3v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 20h8M12 16v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3zM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
</svg>

<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

<!-- ============ sign-in ============ -->
<main id="login" class="login" hidden>
  <form id="loginForm" class="login-card glass" novalidate>
    <div class="orb"><svg><use href="#i-logo"/></svg></div>
    <h1>Welcome back</h1>
    <p class="login-sub">Enter your password to talk to Jarvis</p>

    <div class="pw-field">
      <input id="pw" type="password" autocomplete="current-password" required autofocus
             placeholder="Password" aria-label="Password" aria-describedby="loginError capsHint">
      <button type="button" id="pwToggle" class="icon-btn" aria-label="Show password" title="Show password">
        <svg><use href="#i-eye"/></svg>
      </button>
      <button id="loginBtn" class="pw-go" type="submit" aria-label="Sign in" title="Sign in">
        <svg class="go-icon"><use href="#i-arrow"/></svg><span class="spinner" aria-hidden="true"></span>
      </button>
    </div>

    <div class="login-meta">
      <label class="switch">
        <input id="remember" type="checkbox" checked>
        <span class="track"><span class="thumb"></span></span>
        <span>Stay signed in for 30 days</span>
      </label>
      <span id="capsHint" class="caps-hint" hidden>Caps Lock on</span>
    </div>

    <p id="loginError" class="login-error" role="alert"></p>
  </form>
  <p class="login-foot">Private assistant · runs on your own computer</p>
</main>

<!-- ============ app ============ -->
<div id="app" class="app" hidden>
  <aside id="sidebar" class="sidebar" aria-label="Chats and documents">
    <div class="side-head">
      <div class="brand"><span class="brand-orb"><svg><use href="#i-logo"/></svg></span><span>Jarvis</span></div>
      <button class="icon-btn" id="closeSide" aria-label="Hide sidebar" title="Hide sidebar"><svg><use href="#i-panel"/></svg></button>
    </div>

    <button id="newChat" class="btn-new"><svg><use href="#i-edit"/></svg><span>New chat</span><kbd>Ctrl K</kbd></button>

    <label class="search">
      <svg><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Search chats" aria-label="Search chats">
    </label>

    <nav class="side-scroll">
      <div id="chatGroups"></div>
      <h2 class="side-title">Documents</h2>
      <ul id="docList" class="side-list"></ul>
    </nav>

    <div class="side-foot">
      <div class="seg" role="radiogroup" aria-label="Theme">
        <button data-theme-set="light" role="radio" aria-label="Light theme" title="Light"><svg><use href="#i-sun"/></svg></button>
        <button data-theme-set="system" role="radio" aria-label="System theme" title="System"><svg><use href="#i-monitor"/></svg></button>
        <button data-theme-set="dark" role="radio" aria-label="Dark theme" title="Dark"><svg><use href="#i-moon"/></svg></button>
      </div>
      <button id="logout" class="icon-btn" aria-label="Sign out" title="Sign out"><svg><use href="#i-logout"/></svg></button>
    </div>
  </aside>
  <div id="scrim" class="scrim"></div>

  <section class="main">
    <header class="topbar">
      <button class="icon-btn" id="openSide" aria-label="Show sidebar" title="Show sidebar"><svg><use href="#i-panel"/></svg></button>
      <h1 id="chatTitle" class="chat-title">New chat</h1>
      <button class="icon-btn" id="newChatTop" aria-label="New chat" title="New chat"><svg><use href="#i-edit"/></svg></button>
    </header>

    <div id="scroller" class="scroller">
      <div id="welcome" class="welcome">
        <div class="orb big"><svg><use href="#i-logo"/></svg></div>
        <h2><span id="greeting">Hello</span>, <span class="grad">Thisen</span></h2>
        <p>How can I help today?</p>
        <div class="suggestions">
          <button class="suggest" data-text="What's on my calendar this week?">
            <span class="tile t1"><svg><use href="#i-cal"/></svg></span>
            <span><b>My week</b><small>What's on my calendar?</small></span>
          </button>
          <button class="suggest" data-fill="Add this event: ">
            <span class="tile t2"><svg><use href="#i-plus"/></svg></span>
            <span><b>Add an event</b><small>Paste a message about it</small></span>
          </button>
          <button class="suggest" data-text="What's the weather like today?">
            <span class="tile t3"><svg><use href="#i-sun"/></svg></span>
            <span><b>Weather</b><small>How's it looking today?</small></span>
          </button>
          <button class="suggest" data-text="What's the latest news in Sri Lanka?">
            <span class="tile t4"><svg><use href="#i-globe"/></svg></span>
            <span><b>Latest news</b><small>Search the web for me</small></span>
          </button>
        </div>
      </div>
      <div id="log" class="log" aria-live="polite"></div>
    </div>

    <footer class="composer-wrap">
      <button id="toBottom" class="to-bottom" aria-label="Jump to latest message" hidden><svg><use href="#i-down"/></svg></button>
      <form id="composer" class="composer">
        <div id="attachment" class="attachment" hidden>
          <img id="attachThumb" alt="">
          <span id="attachName"></span>
          <button type="button" id="attachRemove" class="icon-btn small" aria-label="Remove attachment"><svg><use href="#i-x"/></svg></button>
        </div>
        <textarea id="box" rows="1" placeholder="Ask Jarvis anything…" aria-label="Message Jarvis"></textarea>
        <div class="composer-row">
          <button type="button" id="attach" class="chip-btn" title="Attach a PDF or image"><svg><use href="#i-clip"/></svg><span>Attach</span></button>
          <input id="file" type="file" accept=".pdf,application/pdf,image/*" hidden>
          <button type="button" id="thinkBtn" class="chip-btn" aria-pressed="false" title="Slower, more careful answers"><svg><use href="#i-spark"/></svg><span>Think</span></button>
          <span class="spacer"></span>
          <button type="submit" id="send" class="send-btn" aria-label="Send" disabled><svg><use href="#i-send"/></svg></button>
        </div>
      </form>
      <p class="hint">Jarvis can make mistakes. Check dates before relying on them.</p>
    </footer>

    <div id="dropZone" class="drop-zone" hidden><div><svg><use href="#i-clip"/></svg>Drop a PDF or image</div></div>
  </section>
</div>

<dialog id="confirm" class="dialog glass">
  <form method="dialog">
    <h3 id="confirmTitle">Delete?</h3>
    <p id="confirmText"></p>
    <div class="dialog-actions">
      <button value="cancel" class="btn-ghost">Cancel</button>
      <button value="ok" class="btn-danger">Delete</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status"></div>

<script src="/static/app.js"></script>
</body>
</html>
